# Kernie configuration file (/etc/kernie.conf)
# Every setting is optional; the values shown are the defaults.

# The kernel sources symlink kernie works on. Any *-sources package works:
# kernie asks Portage which package owns each source tree.
#KERNEL_SOURCES_PATH=/usr/src/linux

# Where kernel configurations are saved before every change
#KERNEL_BACKUP_PATH=/root/kernel.bak

# Add the selected sources (with their slot) to the world file, so
# emerge --depclean doesn't remove them. 1 = yes, 0 = no
#PROTECT_KERNEL=1

# Who builds the initramfs:
#   auto           installkernel, if it has the dracut or ugrd flag; otherwise none
#   installkernel  installkernel builds it during make install
#                  (needs sys-kernel/installkernel[dracut] or [ugrd])
#   kernie         kernie runs INITRAMFS_CMD after make install
#                  (installkernel without dracut, or another generator)
#   no             no initramfs: the kernel must mount root by itself, so the disk
#                  and filesystem drivers (e.g. BLK_DEV_NVME, BTRFS_FS) must be built in
#INITRAMFS=auto

# Initramfs command for INITRAMFS=kernie and for "Rebuild initramfs".
# %KVER% is replaced by the kernel release, e.g. 7.2.11-gentoo
#INITRAMFS_CMD="dracut --force --kver %KVER%"

# Run grub-mkconfig after installing:
#   auto  only if installkernel lacks the grub flag (or kernie built the initramfs)
#   yes   always
#   no    never
#UPDATE_GRUB=auto
#GRUB_CFG=/boot/grub/grub.cfg

# make options and niceness for the kernel build.
# Empty = Portage's MAKEOPTS and PORTAGE_NICENESS from make.conf
#KERNEL_MAKEOPTS=""
#KERNEL_NICENESS=""

# Configuration tool for "rebuild" and the review step (menuconfig, nconfig, xconfig)
#CONFIG_TOOL=menuconfig

# Kernels kept by "autoclean" (eclean-kernel -n)
#KEEP_KERNELS=2

# Log of every step and its output
#LOG_FILE=/var/log/kernie.log

# Settings from kernie 1 still work: GEN_INITRAMFS=1 means INITRAMFS=kernie,
# and GEN_INITRAMFS_CMD is used as INITRAMFS_CMD if that is unset.
# KERNEL_SOURCES and WORLD_FILE_PATH are no longer used: kernie 2 finds the
# sources package through Portage and edits the world file through emerge.
